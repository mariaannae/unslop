<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Suggestions Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #000;
            color: #0f0;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            background: #222;
            color: #0f0;
            border: 1px solid #0f0;
            cursor: pointer;
        }
        button:hover {
            background: #333;
        }
        #output {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #0f0;
            min-height: 200px;
            white-space: pre-wrap;
        }
        #input {
            width: 100%;
            padding: 10px;
            background: #111;
            color: #0f0;
            border: 1px solid #0f0;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Web-LLM Suggestions Test</h1>
    <p>This tests if the same suggestions are being generated repeatedly.</p>
    
    <input type="text" id="input" value="The quick brown " placeholder="Enter text...">
    
    <button onclick="testSuggestions()">Test Suggestions (5 calls)</button>
    <button onclick="testWithDifferentSeeds()">Test with Different Seeds</button>
    <button onclick="clearEngine()">Clear Engine</button>
    
    <div id="output"></div>
    
    <script type="module">
        let llmEngine = null;
        let callCount = 0;
        
        async function initEngine() {
            if (llmEngine) return llmEngine;
            
            const output = document.getElementById('output');
            output.textContent = 'Initializing engine...\n';
            
            try {
                const WebLLM = await import('https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm');
                const { CreateMLCEngine } = WebLLM;
                
                // Use Qwen2.5-1.5B-Instruct - a larger model (3x the size of 0.5B)
                // Using the pre-configured model from WebLLM's model list
                //const model_id = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC";
                const model_id = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
                
                llmEngine = await CreateMLCEngine(model_id, {
                    logLevel: "INFO",
                });
                
                output.textContent += 'Engine initialized!\n\n';
                window.llmEngine = llmEngine;
                return llmEngine;
            } catch (error) {
                output.textContent += 'Error: ' + error.message + '\n';
                throw error;
            }
        }
        
        window.testSuggestions = async function() {
            const output = document.getElementById('output');
            const input = document.getElementById('input').value;
            
            output.textContent = 'Running 5 suggestion calls with same input...\n\n';
            
            const engine = await initEngine();
            const results = [];
            
            for (let i = 0; i < 5; i++) {
                callCount++;
                const uniqueId = `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                
                try {
                    const messages = [
                        {
                            role: "system",
                            content: `Generate the next word. Call ${callCount}. ID: ${uniqueId}`
                        },
                        {
                            role: "user",
                            content: input + ` [${uniqueId}]`
                        }
                    ];
                    
                    const response = await engine.chat.completions.create({
                        messages: messages,
                        max_tokens: 1,
                        n: 1,
                        top_logprobs: 5,
                        logprobs: true,
                        temperature: 0.2 + (Math.random() * 0.4),
                        stream: false,
                        seed: Math.floor(Math.random() * 10000000)
                    });
                    
                    const logprobs = response.choices[0].logprobs.content[0].top_logprobs;
                    const suggestions = logprobs.map(item => item.token);
                    
                    results.push({
                        call: i + 1,
                        id: response.id,
                        created: response.created,
                        suggestions: suggestions
                    });
                    
                    output.textContent += `Call ${i + 1}:\n`;
                    output.textContent += `  Response ID: ${response.id}\n`;
                    output.textContent += `  Created: ${response.created}\n`;
                    output.textContent += `  Suggestions: ${suggestions.join(', ')}\n\n`;
                    
                    // Small delay between calls
                    await new Promise(resolve => setTimeout(resolve, 100));
                    
                } catch (error) {
                    output.textContent += `Call ${i + 1} ERROR: ${error.message}\n\n`;
                }
            }
            
            // Check if all responses are identical
            const firstSuggestions = results[0]?.suggestions?.join(',') || '';
            const allSame = results.every(r => (r.suggestions?.join(',') || '') === firstSuggestions);
            
            if (allSame) {
                output.textContent += '❌ WARNING: All responses returned identical suggestions!\n';
                output.textContent += 'This indicates a caching issue.\n';
            } else {
                output.textContent += '✅ Good: Responses varied between calls.\n';
            }
        };
        
        window.testWithDifferentSeeds = async function() {
            const output = document.getElementById('output');
            const input = document.getElementById('input').value;
            
            output.textContent = 'Testing with different random seeds...\n\n';
            
            const engine = await initEngine();
            const seeds = [12345, 67890, 11111, 99999, 54321];
            
            for (let i = 0; i < seeds.length; i++) {
                try {
                    const messages = [
                        {
                            role: "user",
                            content: input
                        }
                    ];
                    
                    const response = await engine.chat.completions.create({
                        messages: messages,
                        max_tokens: 1,
                        n: 1,
                        top_logprobs: 5,
                        logprobs: true,
                        temperature: 0.7,
                        stream: false,
                        seed: seeds[i]
                    });
                    
                    const logprobs = response.choices[0].logprobs.content[0].top_logprobs;
                    const suggestions = logprobs.map(item => item.token);
                    
                    output.textContent += `Seed ${seeds[i]}: ${suggestions.join(', ')}\n`;
                    
                } catch (error) {
                    output.textContent += `Seed ${seeds[i]} ERROR: ${error.message}\n`;
                }
            }
        };
        
        window.clearEngine = async function() {
            const output = document.getElementById('output');
            
            if (llmEngine) {
                // Try to reset the engine if possible
                if (llmEngine.resetChat && typeof llmEngine.resetChat === 'function') {
                    await llmEngine.resetChat();
                    output.textContent = 'Engine chat reset.\n';
                } else {
                    output.textContent = 'No resetChat method available.\n';
                }
                
                // Check what methods are available
                output.textContent += '\nAvailable engine methods:\n';
                for (const key in llmEngine) {
                    if (typeof llmEngine[key] === 'function') {
                        output.textContent += `  - ${key}\n`;
                    }
                }
            } else {
                output.textContent = 'No engine initialized yet.\n';
            }
        };
        
        // Auto-initialize on page load
        initEngine().catch(console.error);
    </script>
</body>
</html>
